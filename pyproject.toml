[project]
name = "llm-inference"
version = "0.0.0"
description = "Personal LLM inference benchmarking on a single RTX 3090 (WSL2 Ubuntu)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.11",
    "transformers>=5.8",
    "accelerate>=1.13",
    "bitsandbytes>=0.49",
    "gptqmodel>=7.0",
    "optimum>=2.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
